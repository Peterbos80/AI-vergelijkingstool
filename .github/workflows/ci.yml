name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npx tsx scripts/validate-seed.ts
      # Unit + integration tests run against in-process PostgreSQL (PGlite): no service needed.
      - run: npm test

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aitw
          POSTGRES_PASSWORD: aitw
          POSTGRES_DB: aitoolswijzer_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aitw" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://aitw:aitw@localhost:5432/aitoolswijzer_e2e
      DATABASE_URL: postgres://aitw:aitw@localhost:5432/aitoolswijzer_e2e
      SITE_URL: http://localhost:3200
      APP_SECRET: ci-app-secret-ci-app-secret-ci-app-secret-0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
